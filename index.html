<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>

  <style>
    body{
      margin:0;
      padding:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      background:white;
      padding:40px;
      width:320px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    label{
      font-weight:bold;
      color:#555;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:5px;
      margin-bottom:20px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:16px;
    }

    input:focus{
      outline:none;
      border-color:#4facfe;
    }

    button{
      width:100%;
      padding:12px;
      background:#4facfe;
      color:white;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#007bff;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Login Form</h1>
    <p>Welcome to my login page</p>

    <form>
      <label>Username</label>
      <input type="text" placeholder="Enter username" required>

      <label>Password</label>
      <input type="password" placeholder="Enter password" required>

      <button type="submit">Login</button>
    </form>
  </div>

</body>
</html>
